<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMT Caçapava — Status de Dispositivos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --paper:#eee9df;
    --paper-line:#d8d0bd;
    --ink:#2b2620;
    --ink-soft:#5b5347;
    --kraft:#c9a876;
    --stamp-red:#a13a2e;
    --ok:#3f6b3f;
    --ok-bg:#dfe8d6;
    --partial:#8a7326;
    --partial-bg:#eee3bf;
    --bad:#a15a1f;
    --bad-bg:#f0dcc0;
    --dmg:#a13a2e;
    --dmg-bg:#f0d0c9;
    --broken:#5a5a5a;
    --broken-bg:#dedad2;
    --card-bg:#f7f4ec;
    --shadow: 2px 3px 0 rgba(43,38,32,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Courier New', Courier, monospace;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(216,208,189,0.4) 28px);
    color: var(--ink);
    min-height:100vh;
  }
  header{
    padding: 22px 24px 16px;
    border-bottom: 3px double var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    margin:0;
    font-size: 22px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  header .subtitle{
    font-size:12px;
    color: var(--ink-soft);
    margin-top:4px;
  }
  .stamp{
    border:2px solid var(--stamp-red);
    color: var(--stamp-red);
    padding:4px 10px;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    transform: rotate(-3deg);
    letter-spacing:1px;
    border-radius:3px;
    opacity:0.85;
  }

  /* abas */
  .tabs{
    display:flex;
    gap:2px;
    padding: 14px 24px 0;
    flex-wrap:wrap;
  }
  .tab{
    font-family:inherit;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:9px 16px;
    background: rgba(255,255,255,0.4);
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
    border-bottom:none;
    cursor:pointer;
  }
  .tab .tab-count{
    font-size:10px;
    background: var(--paper-line);
    color: var(--ink);
    padding:1px 6px;
    border-radius:8px;
    margin-left:6px;
  }
  .tab.active{
    background: var(--card-bg);
    color: var(--ink);
    font-weight:bold;
    border-color: var(--ink);
    position:relative;
    top:1px;
  }
  .tab.active .tab-count{ background: var(--ink); color:var(--paper); }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding: 14px 24px;
    background: var(--card-bg);
    border-bottom: 2px solid var(--ink);
    align-items:center;
  }
  .toolbar .spacer{ flex:1; }
  .toolbar .group-label{
    font-size:10px;
    text-transform:uppercase;
    color:var(--ink-soft);
    letter-spacing:0.5px;
    margin-right:2px;
  }
  button{
    font-family:inherit;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:9px 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease;
  }
  button:hover{ transform: translate(-1px,-1px); }
  button:active{ transform: translate(1px,1px); box-shadow:none; }
  button.secondary{
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  button.danger{ background: var(--stamp-red); }
  input[type=file]{ display:none; }

  .category-panel{ display:none; }
  .category-panel.active{ display:block; }

  .board-wrap{
    padding: 20px 24px 40px;
    overflow-x:auto;
  }
  .board{
    display:flex;
    gap:14px;
    min-width: 1200px;
  }
  .column{
    flex:1;
    min-width: 220px;
    background: rgba(255,255,255,0.3);
    border:1px solid var(--paper-line);
    display:flex;
    flex-direction:column;
    min-height: 200px;
  }
  .column-head{
    padding:10px 12px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:bold;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .column-head .count{
    font-size:11px;
    background: var(--ink);
    color:var(--paper);
    padding:2px 7px;
    border-radius:10px;
  }
  .col-0 .column-head{ color: var(--ok); border-color:var(--ok); }
  .col-1 .column-head{ color: var(--partial); border-color:var(--partial); }
  .col-2 .column-head{ color: var(--bad); border-color:var(--bad); }
  .col-3 .column-head{ color: var(--dmg); border-color:var(--dmg); }
  .col-4 .column-head{ color: var(--broken); border-color:var(--broken); }

  .column-body{
    flex:1;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .column-body.drag-over{
    background: repeating-linear-gradient(45deg, rgba(0,0,0,0.03), rgba(0,0,0,0.03) 8px, transparent 8px, transparent 16px);
  }
  .empty-hint{
    font-size:11px;
    color: var(--ink-soft);
    text-align:center;
    padding: 14px 6px;
    border:1px dashed var(--paper-line);
  }

  .card{
    background: var(--card-bg);
    border:1px solid var(--ink);
    box-shadow: var(--shadow);
    padding:10px 12px;
    cursor:grab;
    position:relative;
  }
  .card:active{ cursor:grabbing; }
  .card.dragging{ opacity:0.4; }
  .card .device-name{
    font-weight:bold;
    font-size:13px;
    margin:0 0 2px;
    word-break:break-word;
    padding-right:38px;
  }
  .card .device-type{
    font-size:10px;
    color: var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:8px;
  }
  .badges{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
  .badge{
    font-size:9.5px;
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:0.2px;
    border:1px solid rgba(0,0,0,0.15);
  }
  .badge.good{ background:var(--ok-bg); color:var(--ok); }
  .badge.mid{ background:var(--partial-bg); color:var(--partial); }
  .badge.bad{ background:var(--bad-bg); color:var(--bad); }
  .badge.missing{ background:var(--dmg-bg); color:var(--dmg); }
  .badge.neutral{ background:#e7e2d4; color:var(--ink-soft); }

  .card-actions{
    position:absolute;
    top:8px;
    right:8px;
    display:flex;
    gap:4px;
  }
  .icon-btn{
    background:transparent;
    color: var(--ink-soft);
    border:none;
    box-shadow:none;
    font-size:13px;
    padding:2px 5px;
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--stamp-red); transform:none; }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background: rgba(20,17,13,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--paper);
    border:2px solid var(--ink);
    box-shadow: 4px 5px 0 rgba(0,0,0,0.25);
    width:100%;
    max-width:560px;
    max-height:90vh;
    overflow-y:auto;
    padding:20px 22px 22px;
  }
  .modal h2{
    margin:0 0 4px;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .modal .modal-sub{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .modal-divider{
    border-bottom:2px double var(--ink);
    margin-bottom:14px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color: var(--ink-soft);
    margin-bottom:4px;
  }
  .field input[type=text], .field select{
    width:100%;
    font-family:inherit;
    font-size:13px;
    padding:8px 9px;
    border:1px solid var(--ink);
    background: var(--card-bg);
    color:var(--ink);
  }
  .components-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color: var(--ink-soft);
    margin: 6px 0 8px;
    border-top:1px dashed var(--paper-line);
    padding-top:12px;
  }
  .components-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px 12px;
  }
  @media (max-width:480px){
    .components-grid{ grid-template-columns: 1fr; }
  }
  .comp-field label{
    font-size:10.5px;
    display:block;
    margin-bottom:3px;
    color: var(--ink-soft);
  }
  .comp-field select{
    width:100%;
    font-family:inherit;
    font-size:12px;
    padding:6px 7px;
    border:1px solid var(--ink);
    background: var(--card-bg);
    color:var(--ink);
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  footer{
    padding: 18px 24px 30px;
    border-top:1px solid var(--paper-line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  footer .report-desc{ font-size:11px; color:var(--ink-soft); max-width:560px; }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding:10px 18px;
    font-size:12px;
    box-shadow: var(--shadow);
    opacity:0;
    transition: all 0.25s ease;
    pointer-events:none;
    z-index:200;
    max-width: 80vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Status de Dispositivos</h1>
    <div class="subtitle">GAMT — Caçapava · quadro interno de controle</div>
  </div>
  <div class="stamp">uso interno</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <button id="btnNovo">+ Novo</button>
  <span class="spacer"></span>
  <span class="group-label">Base (todas as abas):</span>
  <button class="secondary" id="btnExportJson">Exportar (.json)</button>
  <button class="secondary" id="btnImportJson">Importar (.json)</button>
  <input type="file" id="fileImport" accept="application/json">
  <button class="secondary" id="btnMergeJson">Mesclar (.json)</button>
  <input type="file" id="fileMerge" accept="application/json">
  <button class="danger" id="btnLimpar">Limpar aba atual</button>
</div>

<div id="panels"></div>

<footer>
  <div class="report-desc">
    O relatório em PDF reúne todas as abas com itens cadastrados: dispositivos gerais, caixas EV3 (com checklist de componentes), placas micro:bit e placas Arduino.
  </div>
  <button id="btnPdf">Exportar relatório (.pdf)</button>
</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Novo item</h2>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-divider"></div>
    <form id="itemForm">
      <div class="field">
        <label for="fNome">Nome / identificação</label>
        <input type="text" id="fNome" placeholder="Ex: Caixa EV3 - 01" required>
      </div>
      <div class="field">
        <label for="fGeral">Status geral</label>
        <select id="fGeral">
          <option>Totalmente funcional</option>
          <option>Parcialmente funcional</option>
          <option>Avariado</option>
          <option>Danificado</option>
          <option>Quebrado</option>
        </select>
      </div>
      <div id="extraFieldsContainer"></div>
      <div id="componentsContainer"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="btnCancelar">Cancelar</button>
        <button type="submit" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================================================================
// CONFIGURAÇÃO DAS CATEGORIAS (abas)
// =====================================================================
const STATUS_GERAL = ["Totalmente funcional","Parcialmente funcional","Avariado","Danificado","Quebrado"];
const COMP_OPTIONS = ["OK","Danificado","Faltando"];

const CATEGORIES = {
  geral: {
    label: "Dispositivos Gerais",
    itemLabel: "dispositivo",
    fields: [
      { key:"tipo", label:"Tipo", type:"select",
        options:["Celular","Computador","Tablet","Laptop","Outros"],
        other:{ key:"tipoOutro", label:"Especifique o tipo", placeholder:"Ex: Impressora, Roteador...", triggerValue:"Outros" } },
      { key:"so", label:"Status do sistema operacional", type:"select", options:["Atualizado","Desatualizado"], badge:true },
      { key:"armazenamento", label:"Status de armazenamento", type:"select", options:["Muito bom","Bom","Regular","Irregular"], badge:true },
      { key:"bateria", label:"Status de bateria", type:"select", options:["Muito bom","Bom","Regular","Irregular"], badge:true },
    ],
    components: null
  },
  ev3: {
    label: "Caixas EV3",
    itemLabel: "caixa EV3",
    fields: [],
    components: [
      { key:"brick", label:"Bloco EV3 (Brick)" },
      { key:"bateria", label:"Bateria recarregável" },
      { key:"carregador", label:"Carregador / fonte" },
      { key:"motorGrande", label:"Motores grandes (2x)" },
      { key:"motorMedio", label:"Motor médio" },
      { key:"sensorToque", label:"Sensor de toque" },
      { key:"sensorCor", label:"Sensor de cor" },
      { key:"sensorUltrassonico", label:"Sensor ultrassônico" },
      { key:"sensorGiro", label:"Sensor giroscópico" },
      { key:"caboUSB", label:"Cabo USB" },
      { key:"cabosConexao", label:"Cabos de conexão (RJ12)" },
      { key:"rodasPecas", label:"Rodas e peças de montagem" },
      { key:"cartaoSD", label:"Cartão SD" },
      { key:"maleta", label:"Maleta / caixa de armazenamento" },
      { key:"manual", label:"Manual / instruções" },
    ]
  },
  microbit: {
    label: "Placas Micro:bit",
    itemLabel: "placa micro:bit",
    fields: [
      { key:"firmware", label:"Firmware", type:"select", options:["Atualizado","Desatualizado"], badge:true },
      { key:"caboUSB", label:"Cabo USB", type:"select", options:["Presente","Faltando"], badge:true },
      { key:"bateria", label:"Case de bateria (pilhas)", type:"select", options:["Presente","Faltando"], badge:true },
    ],
    components: null
  },
  arduino: {
    label: "Placas Arduino",
    itemLabel: "placa Arduino",
    fields: [
      { key:"modelo", label:"Modelo", type:"text", placeholder:"Ex: Uno, Nano, Mega, ESP32..." },
      { key:"caboUSB", label:"Cabo USB", type:"select", options:["Presente","Faltando"], badge:true },
    ],
    components: null
  }
};
const CATEGORY_KEYS = Object.keys(CATEGORIES);

// =====================================================================
// ESTADO (em memória; use exportar/importar/mesclar para persistir)
// =====================================================================
let db = { geral:[], ev3:[], microbit:[], arduino:[] };
let activeCategory = "geral";
let editingId = null;
let draggingId = null;
let draggingCat = null;

function uid(){ return "i_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normalizeName(s){ return String(s).trim().toLowerCase(); }
function nameExists(cat, nome, excludeId){
  const alvo = normalizeName(nome);
  return db[cat].some(d => d.id!==excludeId && normalizeName(d.nome)===alvo);
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// =====================================================================
// MONTAGEM DAS ABAS E PAINÉIS (uma vez, no carregamento)
// =====================================================================
function buildTabsAndPanels(){
  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  CATEGORY_KEYS.forEach(cat=>{
    const cfg = CATEGORIES[cat];

    const tab = document.createElement("button");
    tab.className = "tab" + (cat===activeCategory ? " active" : "");
    tab.dataset.cat = cat;
    tab.innerHTML = escapeHtml(cfg.label) + ' <span class="tab-count" id="tabcount-'+cat+'">0</span>';
    tab.addEventListener("click", ()=> switchTab(cat));
    tabsEl.appendChild(tab);

    const panel = document.createElement("div");
    panel.className = "category-panel" + (cat===activeCategory ? " active" : "");
    panel.id = "panel-" + cat;
    panel.innerHTML = `
      <div class="board-wrap">
        <div class="board" data-cat="${cat}">
          ${STATUS_GERAL.map((s,i)=>`
            <div class="column col-${i}" data-status="${s}">
              <div class="column-head"><span>${s}</span><span class="count">0</span></div>
              <div class="column-body" data-cat="${cat}" data-status="${s}"></div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
    panelsEl.appendChild(panel);
  });

  // drag & drop nas colunas
  document.querySelectorAll(".column-body").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", ()=> col.classList.remove("drag-over"));
    col.addEventListener("drop", e=>{
      e.preventDefault();
      col.classList.remove("drag-over");
      if(!draggingId || draggingCat!==col.dataset.cat) return;
      const item = db[draggingCat].find(x=>x.id===draggingId);
      if(item){
        item.geral = col.dataset.status;
        renderBoard(draggingCat);
        showToast('Status atualizado para "'+col.dataset.status+'"');
      }
    });
  });
}

function switchTab(cat){
  activeCategory = cat;
  document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.cat===cat));
  document.querySelectorAll(".category-panel").forEach(p=> p.classList.toggle("active", p.id==="panel-"+cat));
  document.getElementById("btnNovo").textContent = "+ Novo (" + CATEGORIES[cat].itemLabel + ")";
}

// =====================================================================
// RENDERIZAÇÃO DOS QUADROS
// =====================================================================
function renderAll(){
  CATEGORY_KEYS.forEach(renderBoard);
}

function renderBoard(cat){
  const boardEl = document.querySelector('.board[data-cat="'+cat+'"]');
  STATUS_GERAL.forEach(status=>{
    const col = boardEl.querySelector('.column-body[data-status="'+CSS.escape(status)+'"]');
    const countEl = boardEl.querySelector('.column[data-status="'+CSS.escape(status)+'"] .count');
    const items = db[cat].filter(d=>d.geral===status);
    countEl.textContent = items.length;
    col.innerHTML = "";
    if(items.length===0){
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "sem itens";
      col.appendChild(hint);
      return;
    }
    items.forEach(item=> col.appendChild(buildCard(cat, item)));
  });
  document.getElementById("tabcount-"+cat).textContent = db[cat].length;
}

function badgeClassFor(cat, field, value){
  if(cat==="ev3") return null; // tratado à parte
  const goodValues = ["Atualizado","Muito bom","Presente"];
  const midValues = ["Bom"];
  const lowValues = ["Regular"];
  const badValues = ["Desatualizado","Irregular","Faltando"];
  if(goodValues.includes(value)) return "good";
  if(midValues.includes(value)) return "good";
  if(lowValues.includes(value)) return "mid";
  if(badValues.includes(value)) return "missing";
  return "neutral";
}

function buildCard(cat, item){
  const cfg = CATEGORIES[cat];
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = item.id;

  let subtitle = "";
  let badgesHtml = "";

  if(cat==="geral"){
    subtitle = item.tipo==="Outros" && item.tipoOutro ? ("Outros — "+item.tipoOutro) : item.tipo;
    badgesHtml = cfg.fields.filter(f=>f.badge).map(f=>{
      const val = item[f.key];
      return `<span class="badge ${badgeClassFor(cat,f.key,val)}">${f.label.replace('Status de ','').replace('Status do ','')}: ${escapeHtml(val)}</span>`;
    }).join("");
  } else if(cat==="ev3"){
    const comps = cfg.components;
    let ok=0, dano=0, falt=0;
    comps.forEach(c=>{
      const v = (item.componentes||{})[c.key] || "OK";
      if(v==="OK") ok++; else if(v==="Danificado") dano++; else falt++;
    });
    subtitle = "Kit EV3 · " + comps.length + " itens no checklist";
    badgesHtml = `<span class="badge good">OK: ${ok}</span>`;
    if(dano>0) badgesHtml += `<span class="badge mid">Danificado: ${dano}</span>`;
    if(falt>0) badgesHtml += `<span class="badge missing">Faltando: ${falt}</span>`;
  } else {
    subtitle = cfg.itemLabel;
    badgesHtml = cfg.fields.map(f=>{
      const val = item[f.key];
      if(!val) return "";
      const cls = f.type==="select" ? badgeClassFor(cat,f.key,val) : "neutral";
      return `<span class="badge ${cls}">${f.label}: ${escapeHtml(val)}</span>`;
    }).join("");
  }

  card.innerHTML = `
    <div class="card-actions">
      <button class="icon-btn" title="Editar" data-action="edit">&#9998;</button>
      <button class="icon-btn" title="Excluir" data-action="del">&#10005;</button>
    </div>
    <p class="device-name">${escapeHtml(item.nome)}</p>
    <div class="device-type">${escapeHtml(subtitle)}</div>
    <div class="badges">${badgesHtml}</div>
  `;

  card.addEventListener("dragstart", ()=>{
    draggingId = item.id;
    draggingCat = cat;
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", ()=>{
    card.classList.remove("dragging");
    draggingId = null;
    draggingCat = null;
  });
  card.querySelector('[data-action="edit"]').addEventListener("click", ()=> openEdit(cat, item.id));
  card.querySelector('[data-action="del"]').addEventListener("click", ()=> deleteItem(cat, item.id));

  return card;
}

// =====================================================================
// MODAL (formulário dinâmico por categoria)
// =====================================================================
const overlay = document.getElementById("overlay");
const form = document.getElementById("itemForm");

document.getElementById("btnNovo").addEventListener("click", ()=> openNew(activeCategory));
document.getElementById("btnCancelar").addEventListener("click", closeModal);
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });

function buildExtraFieldsHtml(cat){
  const cfg = CATEGORIES[cat];
  return cfg.fields.map(f=>{
    if(f.type==="select"){
      const opts = f.options.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
      let html = `
        <div class="field">
          <label for="f_extra_${f.key}">${escapeHtml(f.label)}</label>
          <select id="f_extra_${f.key}">${opts}</select>
        </div>`;
      if(f.other){
        html += `
        <div class="field" id="wrap_${f.other.key}" style="display:none;">
          <label for="f_extra_${f.other.key}">${escapeHtml(f.other.label)}</label>
          <input type="text" id="f_extra_${f.other.key}" placeholder="${escapeHtml(f.other.placeholder||'')}">
        </div>`;
      }
      return html;
    }
    // text
    return `
      <div class="field">
        <label for="f_extra_${f.key}">${escapeHtml(f.label)}</label>
        <input type="text" id="f_extra_${f.key}" placeholder="${escapeHtml(f.placeholder||'')}">
      </div>`;
  }).join("");
}

function buildComponentsHtml(cat){
  const cfg = CATEGORIES[cat];
  if(!cfg.components) return "";
  const optsHtml = COMP_OPTIONS.map(o=>`<option value="${o}">${o}</option>`).join("");
  return `
    <div class="components-title">Checklist de componentes</div>
    <div class="components-grid">
      ${cfg.components.map(c=>`
        <div class="comp-field">
          <label for="f_comp_${c.key}">${escapeHtml(c.label)}</label>
          <select id="f_comp_${c.key}">${optsHtml}</select>
        </div>
      `).join("")}
    </div>`;
}

function attachOtherFieldToggles(cat){
  CATEGORIES[cat].fields.forEach(f=>{
    if(f.type==="select" && f.other){
      const sel = document.getElementById("f_extra_"+f.key);
      const wrap = document.getElementById("wrap_"+f.other.key);
      const toggle = ()=>{ wrap.style.display = sel.value===f.other.triggerValue ? "block" : "none"; };
      sel.addEventListener("change", toggle);
      toggle();
    }
  });
}

function openNew(cat){
  editingId = null;
  activeCategory = cat;
  const cfg = CATEGORIES[cat];
  document.getElementById("modalTitle").textContent = "Novo — " + cfg.label;
  document.getElementById("modalSub").textContent = "Preencha os dados de identificação e status.";
  form.reset();
  document.getElementById("extraFieldsContainer").innerHTML = buildExtraFieldsHtml(cat);
  document.getElementById("componentsContainer").innerHTML = buildComponentsHtml(cat);
  attachOtherFieldToggles(cat);
  overlay.dataset.cat = cat;
  overlay.classList.add("open");
  document.getElementById("fNome").focus();
}

function openEdit(cat, id){
  const item = db[cat].find(x=>x.id===id);
  if(!item) return;
  editingId = id;
  activeCategory = cat;
  const cfg = CATEGORIES[cat];
  document.getElementById("modalTitle").textContent = "Editar — " + cfg.label;
  document.getElementById("modalSub").textContent = item.nome;
  document.getElementById("fNome").value = item.nome;
  document.getElementById("fGeral").value = item.geral;
  document.getElementById("extraFieldsContainer").innerHTML = buildExtraFieldsHtml(cat);
  document.getElementById("componentsContainer").innerHTML = buildComponentsHtml(cat);

  cfg.fields.forEach(f=>{
    const el = document.getElementById("f_extra_"+f.key);
    if(el) el.value = item[f.key] || (f.options ? f.options[0] : "");
    if(f.other){
      const otherEl = document.getElementById("f_extra_"+f.other.key);
      if(otherEl) otherEl.value = item[f.other.key] || "";
    }
  });
  if(cfg.components){
    cfg.components.forEach(c=>{
      const el = document.getElementById("f_comp_"+c.key);
      if(el) el.value = (item.componentes||{})[c.key] || "OK";
    });
  }
  attachOtherFieldToggles(cat);

  overlay.dataset.cat = cat;
  overlay.classList.add("open");
}

function closeModal(){
  overlay.classList.remove("open");
  editingId = null;
}

form.addEventListener("submit", e=>{
  e.preventDefault();
  const cat = overlay.dataset.cat;
  const cfg = CATEGORIES[cat];
  const nome = document.getElementById("fNome").value.trim();
  if(!nome) return;
  if(nameExists(cat, nome, editingId)){
    alert('Já existe um(a) '+cfg.itemLabel+' com o nome "'+nome+'". Escolha um nome diferente.');
    return;
  }
  const geral = document.getElementById("fGeral").value;

  const extra = {};
  cfg.fields.forEach(f=>{
    const el = document.getElementById("f_extra_"+f.key);
    extra[f.key] = el ? el.value.trim ? (f.type==="text" ? el.value.trim() : el.value) : el.value : "";
    if(f.other){
      const otherEl = document.getElementById("f_extra_"+f.other.key);
      extra[f.other.key] = otherEl ? otherEl.value.trim() : "";
    }
  });

  let componentes;
  if(cfg.components){
    componentes = {};
    cfg.components.forEach(c=>{
      const el = document.getElementById("f_comp_"+c.key);
      componentes[c.key] = el ? el.value : "OK";
    });
  }

  if(editingId){
    const item = db[cat].find(x=>x.id===editingId);
    Object.assign(item, {nome, geral}, extra);
    if(componentes) item.componentes = componentes;
    showToast(cfg.itemLabel.charAt(0).toUpperCase()+cfg.itemLabel.slice(1)+" atualizado(a)");
  } else {
    const novo = { id: uid(), nome, geral, ...extra };
    if(componentes) novo.componentes = componentes;
    db[cat].push(novo);
    showToast(cfg.itemLabel.charAt(0).toUpperCase()+cfg.itemLabel.slice(1)+" adicionado(a)");
  }
  closeModal();
  renderBoard(cat);
});

function deleteItem(cat, id){
  const item = db[cat].find(x=>x.id===id);
  if(!item) return;
  if(!confirm('Excluir "'+item.nome+'"?')) return;
  db[cat] = db[cat].filter(x=>x.id!==id);
  renderBoard(cat);
  showToast("Item excluído");
}

document.getElementById("btnLimpar").addEventListener("click", ()=>{
  const cat = activeCategory;
  if(db[cat].length===0) return;
  if(!confirm('Isso vai apagar todos os itens da aba "'+CATEGORIES[cat].label+'" (não salva automaticamente). Continuar?')) return;
  db[cat] = [];
  renderBoard(cat);
  showToast("Aba limpa");
});

// =====================================================================
// EXPORTAR / IMPORTAR / MESCLAR (base completa, todas as abas)
// =====================================================================
document.getElementById("btnExportJson").addEventListener("click", ()=>{
  const payload = {
    exportado_em: new Date().toISOString(),
    origem: "GAMT Caçapava - Status de Dispositivos",
    dados: db
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gamt-status-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Base exportada em .json");
});

function extractDados(data){
  if(data && data.dados) return data.dados;
  // compatibilidade com formato antigo (só dispositivos gerais)
  if(Array.isArray(data && data.dispositivos)) return { geral: data.dispositivos, ev3:[], microbit:[], arduino:[] };
  if(Array.isArray(data)) return { geral: data, ev3:[], microbit:[], arduino:[] };
  return null;
}

function sanitizeItem(cat, raw){
  const cfg = CATEGORIES[cat];
  const item = {
    id: raw.id || uid(),
    nome: (raw.nome || "Sem nome").trim(),
    geral: STATUS_GERAL.includes(raw.geral) ? raw.geral : "Totalmente funcional"
  };
  cfg.fields.forEach(f=>{
    item[f.key] = raw[f.key] || (f.options ? f.options[0] : "");
    if(f.other) item[f.other.key] = raw[f.other.key] || "";
  });
  if(cfg.components){
    item.componentes = {};
    cfg.components.forEach(c=>{
      item.componentes[c.key] = COMP_OPTIONS.includes((raw.componentes||{})[c.key]) ? raw.componentes[c.key] : "OK";
    });
  }
  return item;
}

document.getElementById("btnImportJson").addEventListener("click", ()=> document.getElementById("fileImport").click());
document.getElementById("fileImport").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const data = JSON.parse(evt.target.result);
      const dados = extractDados(data);
      if(!dados) throw new Error("formato inválido");
      const novoDb = { geral:[], ev3:[], microbit:[], arduino:[] };
      CATEGORY_KEYS.forEach(cat=>{
        const lista = Array.isArray(dados[cat]) ? dados[cat] : [];
        novoDb[cat] = lista.map(raw=> sanitizeItem(cat, raw));
      });
      db = novoDb;
      renderAll();
      showToast("Base importada com sucesso");
    }catch(err){
      alert("Não foi possível ler o arquivo. Verifique se é um .json exportado por este site.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("btnMergeJson").addEventListener("click", ()=> document.getElementById("fileMerge").click());
document.getElementById("fileMerge").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const data = JSON.parse(evt.target.result);
      const dados = extractDados(data);
      if(!dados) throw new Error("formato inválido");

      const resumo = [];
      CATEGORY_KEYS.forEach(cat=>{
        const lista = Array.isArray(dados[cat]) ? dados[cat] : [];
        if(lista.length===0) return;
        const nomesNaBase = new Set(db[cat].map(d=>normalizeName(d.nome)));
        let adicionados = 0, ignorados = 0;
        lista.forEach(raw=>{
          const nome = (raw.nome || "").trim();
          if(!nome) return;
          const chave = normalizeName(nome);
          if(nomesNaBase.has(chave)){ ignorados++; return; }
          const item = sanitizeItem(cat, raw);
          item.id = uid();
          item.nome = nome;
          db[cat].push(item);
          nomesNaBase.add(chave);
          adicionados++;
        });
        if(adicionados>0 || ignorados>0){
          resumo.push(CATEGORIES[cat].label+": +"+adicionados+(ignorados>0 ? " ("+ignorados+" ignorado(s) por nome duplicado)" : ""));
        }
      });

      renderAll();
      showToast(resumo.length ? resumo.join(" · ") : "Nada para mesclar");
    }catch(err){
      alert("Não foi possível ler o arquivo. Verifique se é um .json exportado por este site.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

// =====================================================================
// RELATÓRIO EM PDF (todas as abas)
// =====================================================================
document.getElementById("btnPdf").addEventListener("click", ()=>{
  const totalItens = CATEGORY_KEYS.reduce((acc,cat)=> acc + db[cat].length, 0);
  if(totalItens===0){
    alert("Não há itens cadastrados em nenhuma aba para gerar o relatório.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let cursorY = 16;
  let firstSection = true;

  doc.setFontSize(14);
  doc.text("GAMT Caçapava — Relatório de Status de Dispositivos", 14, cursorY);
  cursorY += 6;
  doc.setFontSize(9);
  doc.setTextColor(90);
  doc.text("Gerado em " + new Date().toLocaleString("pt-BR"), 14, cursorY);
  cursorY += 8;

  function ensureSpace(needed){
    if(cursorY + needed > 280){ doc.addPage(); cursorY = 16; }
  }

  // Geral
  if(db.geral.length>0){
    ensureSpace(20);
    doc.setFontSize(11); doc.setTextColor(30);
    doc.text("Dispositivos Gerais", 14, cursorY);
    doc.autoTable({
      startY: cursorY+3,
      head: [["Dispositivo","Tipo","Status geral","Sistema operacional","Armazenamento","Bateria"]],
      body: db.geral.map(d=>[
        d.nome,
        d.tipo==="Outros" && d.tipoOutro ? ("Outros — "+d.tipoOutro) : d.tipo,
        d.geral, d.so, d.armazenamento, d.bateria
      ]),
      styles:{ fontSize:8, cellPadding:3 },
      headStyles:{ fillColor:[43,38,32] },
      alternateRowStyles:{ fillColor:[240,237,229] },
    });
    cursorY = doc.lastAutoTable.finalY + 12;
    firstSection = false;
  }

  // EV3
  if(db.ev3.length>0){
    ensureSpace(20);
    doc.setFontSize(11); doc.setTextColor(30);
    doc.text("Caixas EV3", 14, cursorY);
    const compsCfg = CATEGORIES.ev3.components;
    doc.autoTable({
      startY: cursorY+3,
      head: [["Caixa","Status geral","OK","Danificados","Faltando","Itens com problema"]],
      body: db.ev3.map(kit=>{
        let ok=0, dano=[], falt=[];
        compsCfg.forEach(c=>{
          const v = (kit.componentes||{})[c.key] || "OK";
          if(v==="OK") ok++;
          else if(v==="Danificado") dano.push(c.label);
          else falt.push(c.label);
        });
        const problemas = [...dano.map(x=>x+" (danificado)"), ...falt.map(x=>x+" (faltando)")].join("; ") || "—";
        return [kit.nome, kit.geral, String(ok), String(dano.length), String(falt.length), problemas];
      }),
      styles:{ fontSize:7.5, cellPadding:3 },
      headStyles:{ fillColor:[43,38,32] },
      alternateRowStyles:{ fillColor:[240,237,229] },
      columnStyles:{ 5:{ cellWidth:70 } }
    });
    cursorY = doc.lastAutoTable.finalY + 12;
    firstSection = false;
  }

  // Micro:bit
  if(db.microbit.length>0){
    ensureSpace(20);
    doc.setFontSize(11); doc.setTextColor(30);
    doc.text("Placas Micro:bit", 14, cursorY);
    doc.autoTable({
      startY: cursorY+3,
      head: [["Placa","Status geral","Firmware","Cabo USB","Bateria"]],
      body: db.microbit.map(m=>[m.nome, m.geral, m.firmware, m.caboUSB, m.bateria]),
      styles:{ fontSize:8, cellPadding:3 },
      headStyles:{ fillColor:[43,38,32] },
      alternateRowStyles:{ fillColor:[240,237,229] },
    });
    cursorY = doc.lastAutoTable.finalY + 12;
    firstSection = false;
  }

  // Arduino
  if(db.arduino.length>0){
    ensureSpace(20);
    doc.setFontSize(11); doc.setTextColor(30);
    doc.text("Placas Arduino", 14, cursorY);
    doc.autoTable({
      startY: cursorY+3,
      head: [["Placa","Modelo","Status geral","Cabo USB"]],
      body: db.arduino.map(a=>[a.nome, a.modelo || "—", a.geral, a.caboUSB]),
      styles:{ fontSize:8, cellPadding:3 },
      headStyles:{ fillColor:[43,38,32] },
      alternateRowStyles:{ fillColor:[240,237,229] },
    });
    cursorY = doc.lastAutoTable.finalY + 10;
  }

  doc.setFontSize(9); doc.setTextColor(90);
  doc.text("Total geral de itens cadastrados: " + totalItens, 14, cursorY);

  doc.save("gamt-relatorio-" + new Date().toISOString().slice(0,10) + ".pdf");
  showToast("Relatório PDF gerado");
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}
